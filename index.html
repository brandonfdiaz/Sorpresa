<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Vale ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at center, #ffb6c8 0%, #ff769b 45%, #ef4778 100%);
}

/* FONDO */

.background-heart{
    position:absolute;
    opacity:.15;
    animation:backgroundFloat 8s linear infinite;
}

@keyframes backgroundFloat{
    from{
        transform:translateY(110vh) rotate(0deg);
    }
    to{
        transform:translateY(-20vh) rotate(360deg);
    }
}

/* CONTENIDO */

.container{
    position:relative;
    z-index:5;
    text-align:center;
    padding:25px;
}

.pre-title{
    color:white;
    font-size:clamp(1.3rem,4vw,2rem);
    font-weight:bold;
    text-shadow:0 3px 10px rgba(0,0,0,.2);
    margin-bottom:25px;
    transition:.4s;
}

/* CORAZÓN */

.heart-container{
    position:relative;
    width:260px;
    height:260px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

.heart-button{
    position:relative;
    width:170px;
    height:170px;
    border:none;
    background:none;
    cursor:pointer;
    transition:.2s;
    animation:beat 1s infinite;
    filter:drop-shadow(0 15px 20px rgba(150,0,40,.3));
}

.heart-button:hover{
    transform:scale(1.08);
}

.heart{
    font-size:150px;
    line-height:1;
    user-select:none;
}

/* LATIDO */

@keyframes beat{

    0%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.15);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.12);
    }

    60%{
        transform:scale(1);
    }

}

/* CLICK */

.click-text{
    color:white;
    font-size:1rem;
    opacity:.85;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{
        opacity:.35;
    }
}

/* EXPLOSIÓN CORAZÓN */

.heart-button.explode{

    animation:heartExplosion .7s forwards;

}

@keyframes heartExplosion{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.6);
    }

    60%{
        transform:scale(.5) rotate(20deg);
        opacity:1;
    }

    100%{
        transform:scale(4);
        opacity:0;
    }

}

/* PARTÍCULAS */

.particle{
    position:fixed;
    left:50%;
    top:50%;
    z-index:20;
    pointer-events:none;
    font-size:35px;

    animation:
        explodeParticle var(--duration)
        cubic-bezier(.15,.7,.3,1)
        forwards;
}

@keyframes explodeParticle{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.3)
            rotate(0deg);

        opacity:1;
    }

    75%{
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(var(--scale))
            rotate(var(--rotation));

        opacity:0;
    }

}

/* GATOS */

.cat{
    position:fixed;
    z-index:15;
    pointer-events:none;

    animation:catFly var(--duration)
    cubic-bezier(.15,.7,.3,1)
    forwards;
}

@keyframes catFly{

    0%{

        left:50%;
        top:50%;

        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(0deg);

        opacity:0;

    }

    10%{
        opacity:1;
    }

    100%{

        left:var(--x);
        top:var(--y);

        transform:
            translate(-50%,-50%)
            scale(var(--scale))
            rotate(var(--rotate));

        opacity:1;

    }

}

/* MENSAJE FINAL */

.final-message{

    display:none;

    position:relative;
    z-index:30;

    animation:messageAppear 1s forwards;

}

.final-message.show{
    display:block;
}

@keyframes messageAppear{

    from{
        transform:scale(.4);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.main-text{

    font-size:clamp(2.5rem,8vw,5.5rem);

    font-weight:900;

    color:white;

    margin:0;

    line-height:1;

    text-shadow:
        0 4px 0 #df3266,
        0 8px 25px rgba(130,0,40,.35);

}

.amorcito{

    display:block;

    margin-top:15px;

    font-size:clamp(2rem,7vw,4.5rem);

    color:#fff4f7;

}

.signature{

    margin-top:28px;

    display:inline-block;

    background:rgba(255,255,255,.22);

    backdrop-filter:blur(10px);

    border:2px solid rgba(255,255,255,.4);

    padding:14px 25px;

    border-radius:100px;

    color:white;

    font-size:clamp(1.1rem,4vw,1.7rem);

    font-weight:bold;

}

/* GATO CENTRAL */

.big-cat{

    font-size:100px;

    display:block;

    margin-bottom:15px;

    animation:catDance .8s infinite alternate;

}

@keyframes catDance{

    from{
        transform:rotate(-8deg) scale(1);
    }

    to{
        transform:rotate(8deg) scale(1.1);
    }

}

/* BOTÓN DE NUEVO */

.again{

    margin-top:25px;

    border:none;

    padding:12px 22px;

    border-radius:100px;

    background:white;

    color:#ef4778;

    font-weight:bold;

    cursor:pointer;

    font-size:1rem;

    transition:.2s;

}

.again:hover{

    transform:scale(1.08);

}

/* FLASH */

.flash{

    position:fixed;

    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:100;

}

.flash.active{

    animation:flash .4s;

}

@keyframes flash{

    0%{opacity:0;}

    40%{opacity:.9;}

    100%{opacity:0;}

}


/* CELULAR */

@media(max-width:600px){

    .heart{
        font-size:130px;
    }

    .big-cat{
        font-size:80px;
    }

}

</style>
</head>

<body>

<div id="flash" class="flash"></div>

<div class="container">

    <div id="beforeExplosion">

        <div class="pre-title">
            Vale... tengo algo para ti 🥺
        </div>

        <div class="heart-container">

            <button
                id="heartButton"
                class="heart-button"
                aria-label="Abrir mensaje para Vale"
            >

                <span class="heart">
                    ❤️
                </span>

            </button>

        </div>

        <div class="click-text">
            toca el corazón 👆
        </div>

    </div>


    <div
        id="finalMessage"
        class="final-message"
    >

        <span class="big-cat">
            😽
        </span>

        <h1 class="main-text">

            TE AMO

            <span class="amorcito">
                MI AMORCITO ❤️
            </span>

        </h1>

        <div class="signature">

            Para Vale 💗 de tu Brandito 🐱

        </div>

        <br>

        <button
            id="againButton"
            class="again"
        >

            explotar otra vez 💥

        </button>

    </div>

</div>


<script>

/* CORAZONES DE FONDO */

function createBackgroundHearts(){

    const symbols = [
        "♡",
        "♥",
        "💕",
        "💗"
    ];

    for(let i=0;i<18;i++){

        const heart =
            document.createElement("div");

        heart.className =
            "background-heart";

        heart.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        heart.style.left =
            Math.random()*100 + "vw";

        heart.style.fontSize =
            (20 + Math.random()*35) + "px";

        heart.style.animationDelay =
            (Math.random()*8) + "s";

        heart.style.animationDuration =
            (6 + Math.random()*7) + "s";

        document.body.appendChild(heart);

    }

}

createBackgroundHearts();


/* ELEMENTOS */

const heartButton =
    document.getElementById("heartButton");

const beforeExplosion =
    document.getElementById("beforeExplosion");

const finalMessage =
    document.getElementById("finalMessage");

const flash =
    document.getElementById("flash");

const againButton =
    document.getElementById("againButton");


/* EXPLOSIÓN */

heartButton.addEventListener(
    "click",
    explodeLove
);


function explodeLove(){

    heartButton.disabled = true;

    heartButton.classList.add(
        "explode"
    );

    flash.classList.add(
        "active"
    );


    setTimeout(()=>{

        flash.classList.remove(
            "active"
        );

    },400);


    createExplosion();

    createCats();


    setTimeout(()=>{

        beforeExplosion.style.display =
            "none";

        finalMessage.classList.add(
            "show"
        );

    },650);

}


/* CORAZONES Y MEMES */

function createExplosion(){

    const memes = [

        "❤️",
        "💖",
        "💕",
        "💘",
        "💗",
        "💞",
        "😻",
        "😽",
        "🐱",
        "🐈",
        "MIAU",
        "TE AMO",
        "💥"

    ];


    for(let i=0;i<85;i++){

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.textContent =
            memes[
                Math.floor(
                    Math.random() *
                    memes.length
                )
            ];


        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            180 +
            Math.random()*600;


        const x =
            Math.cos(angle) *
            distance;

        const y =
            Math.sin(angle) *
            distance;


        particle.style.setProperty(
            "--x",
            x+"px"
        );

        particle.style.setProperty(
            "--y",
            y+"px"
        );

        particle.style.setProperty(
            "--rotation",
            (
                -360 +
                Math.random()*720
            )+"deg"
        );

        particle.style.setProperty(
            "--scale",
            .6 + Math.random()*1.5
        );

        particle.style.setProperty(
            "--duration",
            (
                .8 +
                Math.random()*1.2
            )+"s"
        );

        particle.style.fontSize =
            (
                22 +
                Math.random()*35
            )+"px";


        document.body.appendChild(
            particle
        );


        setTimeout(()=>{

            particle.remove();

        },2300);

    }

}


/* GATOS QUE SALEN DISPARADOS */

function createCats(){

    const cats = [

        "🐱",
        "😺",
        "😸",
        "😹",
        "😻",
        "😼",
        "😽",
        "🙀",
        "🐈",
        "🐈‍⬛"

    ];


    for(let i=0;i<22;i++){

        const cat =
            document.createElement("div");

        cat.className =
            "cat";

        cat.textContent =
            cats[
                Math.floor(
                    Math.random() *
                    cats.length
                )
            ];


        cat.style.setProperty(
            "--x",
            (
                5 +
                Math.random()*90
            )+"vw"
        );

        cat.style.setProperty(
            "--y",
            (
                5 +
                Math.random()*90
            )+"vh"
        );

        cat.style.setProperty(
            "--rotate",
            (
                -40 +
                Math.random()*80
            )+"deg"
        );

        cat.style.setProperty(
            "--scale",
            .7 +
            Math.random()*1.5
        );

        cat.style.setProperty(
            "--duration",
            (
                .6 +
                Math.random()*1.1
            )+"s"
        );

        cat.style.fontSize =
            (
                35 +
                Math.random()*45
            )+"px";


        document.body.appendChild(
            cat
        );

    }

}


/* EXPLOTAR DE NUEVO */

againButton.addEventListener(
    "click",
    ()=>{
        createExplosion();
        createCats();

        flash.classList.add(
            "active"
        );

        setTimeout(()=>{

            flash.classList.remove(
                "active"
            );

        },400);
    }
);

</script>

</body>

</html>
