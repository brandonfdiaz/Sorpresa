<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Vale ❤️</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial, Helvetica, sans-serif;
      background:radial-gradient(circle at center, #ffbfd0 0%, #ff7ea5 45%, #f04d7f 100%);
      position:relative;
    }

    .floating-heart{
      position:fixed;
      bottom:-50px;
      opacity:.18;
      pointer-events:none;
      animation:floatUp linear forwards;
      z-index:1;
    }

    @keyframes floatUp{
      from{
        transform:translateY(0) rotate(0deg);
        opacity:.18;
      }
      to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
      }
    }

    .container{
      position:relative;
      z-index:10;
      text-align:center;
      padding:24px;
      width:min(92vw, 900px);
    }

    .intro{
      display:block;
    }

    .intro.hide{
      display:none;
    }

    .title-small{
      color:white;
      font-size:clamp(1.3rem, 4vw, 2.1rem);
      font-weight:bold;
      text-shadow:0 4px 15px rgba(0,0,0,.18);
      margin-bottom:12px;
    }

    .title-small-2{
      color:#fff7fa;
      font-size:clamp(1rem, 3vw, 1.3rem);
      margin-bottom:28px;
      opacity:.95;
    }

    .heart-wrap{
      position:relative;
      width:280px;
      height:280px;
      margin:0 auto 10px auto;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .heart-btn{
      border:none;
      background:none;
      cursor:pointer;
      font-size:160px;
      line-height:1;
      animation:beat 1s infinite;
      filter:drop-shadow(0 18px 25px rgba(132,0,39,.25));
      transition:transform .2s ease;
    }

    .heart-btn:hover{
      transform:scale(1.06);
    }

    .heart-btn:active{
      transform:scale(.95);
    }

    @keyframes beat{
      0%{transform:scale(1);}
      18%{transform:scale(1.14);}
      36%{transform:scale(1);}
      54%{transform:scale(1.11);}
      72%{transform:scale(1);}
      100%{transform:scale(1);}
    }

    .heart-btn.explode{
      animation:explodeHeart .7s forwards;
    }

    @keyframes explodeHeart{
      0%{
        transform:scale(1);
        opacity:1;
      }
      35%{
        transform:scale(1.55);
        opacity:1;
      }
      70%{
        transform:scale(.4) rotate(25deg);
        opacity:1;
      }
      100%{
        transform:scale(4);
        opacity:0;
      }
    }

    .click-text{
      color:white;
      font-weight:bold;
      font-size:1rem;
      opacity:.92;
      animation:blink 1.5s infinite;
    }

    @keyframes blink{
      50%{opacity:.45;}
    }

    .flash{
      position:fixed;
      inset:0;
      background:white;
      opacity:0;
      pointer-events:none;
      z-index:999;
    }

    .flash.active{
      animation:flashBang .45s forwards;
    }

    @keyframes flashBang{
      0%{opacity:0;}
      35%{opacity:.9;}
      100%{opacity:0;}
    }

    .particle{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      z-index:30;
      pointer-events:none;
      font-weight:bold;
      animation:particleFly var(--duration) cubic-bezier(.14,.7,.3,1) forwards;
    }

    @keyframes particleFly{
      0%{
        transform:translate(-50%,-50%) scale(.3) rotate(0deg);
        opacity:1;
      }
      100%{
        transform:
          translate(calc(-50% + var(--x)), calc(-50% + var(--y)))
          scale(var(--scale))
          rotate(var(--rotate));
        opacity:0;
      }
    }

    .cat{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      z-index:25;
      pointer-events:none;
      object-fit:cover;
      border-radius:14px;
      box-shadow:0 10px 25px rgba(0,0,0,.28);
      animation:catFly var(--duration) cubic-bezier(.12,.75,.25,1) forwards;
    }

    @keyframes catFly{
      0%{
        transform:translate(-50%,-50%) scale(.15) rotate(0deg);
        opacity:0;
      }
      10%{
        opacity:1;
      }
      100%{
        left:var(--left);
        top:var(--top);
        transform:translate(-50%,-50%) scale(var(--scale)) rotate(var(--rotate));
        opacity:1;
      }
    }

    .final-message{
      display:none;
      position:relative;
      z-index:40;
      animation:appear .9s ease forwards;
    }

    .final-message.show{
      display:block;
    }

    @keyframes appear{
      from{
        opacity:0;
        transform:scale(.45);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .big-cat{
      font-size:95px;
      display:block;
      margin-bottom:10px;
      animation:wiggle .8s infinite alternate;
    }

    @keyframes wiggle{
      from{transform:rotate(-8deg) scale(1);}
      to{transform:rotate(8deg) scale(1.08);}
    }

    .love-text{
      font-size:clamp(2.4rem, 8vw, 5.4rem);
      font-weight:900;
      color:white;
      line-height:1;
      margin:0;
      text-shadow:
        0 4px 0 #db3a6d,
        0 10px 30px rgba(114,0,36,.25);
    }

    .love-text span{
      display:block;
      margin-top:14px;
      color:#fff5f8;
      font-size:clamp(1.9rem, 6vw, 4.1rem);
    }

    .signature{
      display:inline-block;
      margin-top:26px;
      background:rgba(255,255,255,.22);
      color:white;
      border:2px solid rgba(255,255,255,.35);
      border-radius:999px;
      padding:14px 24px;
      font-weight:bold;
      font-size:clamp(1rem, 3.4vw, 1.55rem);
      backdrop-filter:blur(10px);
      box-shadow:0 10px 25px rgba(0,0,0,.12);
    }

    .again-btn{
      margin-top:24px;
      border:none;
      background:white;
      color:#ef4c7e;
      padding:12px 22px;
      border-radius:999px;
      font-weight:bold;
      cursor:pointer;
      font-size:1rem;
      transition:transform .2s ease;
    }

    .again-btn:hover{
      transform:scale(1.06);
    }

    .mini-note{
      margin-top:14px;
      color:#fff7fa;
      opacity:.92;
      font-size:.95rem;
    }

    @media(max-width:600px){
      .heart-btn{
        font-size:130px;
      }

      .heart-wrap{
        width:230px;
        height:230px;
      }

      .big-cat{
        font-size:80px;
      }
    }
  </style>
</head>
<body>

  <div id="flash" class="flash"></div>

  <div class="container">

    <div id="intro" class="intro">
      <div class="title-small">Vale... tengo algo para ti 🥺</div>
      <div class="title-small-2">toca el corazón ❤️</div>

      <div class="heart-wrap">
        <button id="heartBtn" class="heart-btn" aria-label="Abrir sorpresa">
          ❤️
        </button>
      </div>

      <div class="click-text">haz click aquí 👆</div>
    </div>

    <div id="finalMessage" class="final-message">
      <span class="big-cat">😽</span>

      <h1 class="love-text">
        TE AMO
        <span>MI AMORCITO ❤️</span>
      </h1>

      <div class="signature">
        Para Vale 💗 de Brandito 🐱
      </div>

      <div class="mini-note">
        con explosión de gatitos meme jsjs 💥
      </div>

      <button id="againBtn" class="again-btn">
        explotar otra vez 💥
      </button>
    </div>

  </div>

  <script>
    const heartBtn = document.getElementById("heartBtn");
    const intro = document.getElementById("intro");
    const finalMessage = document.getElementById("finalMessage");
    const flash = document.getElementById("flash");
    const againBtn = document.getElementById("againBtn");

    // AQUÍ VAN LOS NOMBRES DE LAS FOTOS
    const catImages = [
      "gato1.png",
      "gato2.png",
      "gato3.png",
      "gato4.png",
      "gato5.png"
    ];

    function createBackgroundHearts(){
      const symbols = ["♡","♥","💕","💗","💖"];

      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (18 + Math.random() * 28) + "px";
        heart.style.animationDuration = (5 + Math.random() * 5) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 10000);
      }, 450);
    }

    createBackgroundHearts();

    function randomBetween(min, max){
      return Math.random() * (max - min) + min;
    }

    function explodeEverything(firstTime = false){
      flash.classList.add("active");
      setTimeout(() => {
        flash.classList.remove("active");
      }, 450);

      createParticles(90);
      createCats(28);

      if(firstTime){
        heartBtn.disabled = true;
        heartBtn.classList.add("explode");

        setTimeout(() => {
          intro.classList.add("hide");
          finalMessage.classList.add("show");
        }, 650);
      }
    }

    function createParticles(amount){
      const items = [
        "❤️","💖","💕","💗","💘","💞","😻","😽","🐱","MIAU","TE AMO","💥"
      ];

      for(let i = 0; i < amount; i++){
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.textContent = items[Math.floor(Math.random() * items.length)];

        const angle = Math.random() * Math.PI * 2;
        const distance = randomBetween(140, 650);

        const x = Math.cos(angle) * distance + "px";
        const y = Math.sin(angle) * distance + "px";

        particle.style.setProperty("--x", x);
        particle.style.setProperty("--y", y);
        particle.style.setProperty("--scale", randomBetween(.7, 1.8));
        particle.style.setProperty("--rotate", randomBetween(-360, 360) + "deg");
        particle.style.setProperty("--duration", randomBetween(.9, 1.8) + "s");
        particle.style.fontSize = randomBetween(20, 40) + "px";

        document.body.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 2200);
      }
    }

    function createCats(amount){
      for(let i = 0; i < amount; i++){
        const cat = document.createElement("img");
        cat.className = "cat";
        cat.src = catImages[Math.floor(Math.random() * catImages.length)];
        cat.alt = "gatito meme";

        cat.style.width = randomBetween(70, 140) + "px";
        cat.style.height = randomBetween(70, 140) + "px";
        cat.style.setProperty("--left", randomBetween(5, 95) + "vw");
        cat.style.setProperty("--top", randomBetween(8, 92) + "vh");
        cat.style.setProperty("--scale", randomBetween(.8, 1.45));
        cat.style.setProperty("--rotate", randomBetween(-50, 50) + "deg");
        cat.style.setProperty("--duration", randomBetween(.6, 1.5) + "s");

        document.body.appendChild(cat);

        setTimeout(() => {
          cat.remove();
        }, 5000);
      }
    }

    heartBtn.addEventListener("click", () => {
      explodeEverything(true);
    });

    againBtn.addEventListener("click", () => {
      explodeEverything(false);
    });
  </script>

</body>
</html>
